{% extends "./includes/template.html" %}

{% block content %}
<div class="govuk-width-container">


  <a href="#" onclick="history.back()" class="govuk-back-link">Back</a>

    <main class="govuk-main-wrapper " id="main-content" role="main">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">

        <form class="form" method="post" novalidate>

          <div class="govuk-form-group">
            <fieldset class="govuk-fieldset" aria-describedby="has-already-got-hint">
              <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
                <h1 class="govuk-fieldset__heading">
                  {% if data['scenario'] == '2' %}
                    What type of ID does Damien Adams have?
                  {% else %}
                    What type of ID does Kevin Hall have?
                  {% endif %}
                </h1>
              </legend>
              <div id="has-already-got-hint" class="govuk-hint">
                Select all that apply.
              </div>
              <div class="govuk-checkboxes" data-module="govuk-checkboxes">
                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="ID-type-birth" name="ID-type" type="checkbox" value="Birth certificate">
                  <label class="govuk-label govuk-checkboxes__label" for="ID-type-birth">
                    Birth certificate
                  </label>
                </div>

                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="ID-type-passport" name="ID-type" type="checkbox" value="Passport">
                  <label class="govuk-label govuk-checkboxes__label" for="ID-type-passport">
                    Passport
                  </label>
                </div>

                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="ID-type-driving" name="ID-type" type="checkbox" value="UK driving licence">
                  <label class="govuk-label govuk-checkboxes__label" for="ID-type-driving">
                    UK driving licence
                  </label>
                </div>

              </div>

            </fieldset>
          </div>

          <button class="govuk-button" data-module="govuk-button">
            Continue
          </button>
        </form>

      </div>


    </div>
  </main>
</div>

{% endblock %}
