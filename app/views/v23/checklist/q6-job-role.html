{% extends "./includes/template.html" %}

{% block content %}
<div class="govuk-width-container">


  <a href="#" onclick="history.back()" class="govuk-back-link">Back</a>

    <main class="govuk-main-wrapper " id="main-content" role="main">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">

        <h1 class="govuk-heading-l">
          {% if data['scenario'] == '2' %}
            Is Damien Adams interested in a particular job?
          {% else %}
            Is Kevin Hall interested in a particular job?
          {% endif %}

        </h1>

        <!-- <form action="/v20/checklist/scenario-1/q7-work-experience" method="post" novalidate> -->
        <form class="form" method="post" novalidate>

          <div class="govuk-form-group">
            <fieldset class="govuk-fieldset">
              <div class="govuk-radios govuk-radios--conditional" data-module="govuk-radios">
                <div class="govuk-radios__item">

                  <input class="govuk-radios__input" id="work-goals" name="work-goals" type="radio" value="Yes" data-aria-controls="conditional-work-goals">
                  <label class="govuk-label govuk-radios__label" for="work-goals">
                    Yes
                  </label>
                </div>
                <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-work-goals">
                  <div class="govuk-character-count" data-module="govuk-character-count" data-maxlength="200">
                  <div class="govuk-form-group">
                    <label class="govuk-label" for="work-goals">
                      Give details
                    </label>
                    </h1>
                    <textarea class="govuk-textarea" id="with-hint" name="with-hint" rows="3" aria-describedby="with-hint-info with-hint-hint"></textarea>
                  </div>
                </div>

                </div>
                <div class="govuk-radios__item">
                  <input class="govuk-radios__input" id="work-goals-2" name="work-goals" type="radio" value="No" data-aria-controls="conditional-work-goals-2">
                  <label class="govuk-label govuk-radios__label" for="work-goals-2">
                    No
                  </label>
                </div>
                </div>

            </fieldset>
          </div>

          <button class="govuk-button" data-module="govuk-button">
            Continue
          </button>
        </form>

      </div>


    </div>
  </main>
</div>

{% endblock %}
