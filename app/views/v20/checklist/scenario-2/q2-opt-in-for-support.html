{% extends "./includes/template.html" %}

{% block content %}
<div class="govuk-width-container">


    <a href="/v19/checklist/scenario-2/q2-right-to-work" class="govuk-back-link">Back</a>

    <main class="govuk-main-wrapper " id="main-content" role="main">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">

        <h1 class="govuk-heading-l">
          Does Daniel Hall want support getting work on release?
        </h1>

        <form action="/2-opt-in-for-support-answer" method="post" novalidate>

          <div class="govuk-form-group">
            <fieldset class="govuk-fieldset">
              <div class="govuk-radios" data-module="govuk-radios">
                <div class="govuk-radios__item">
                  <input class="govuk-radios__input" id="2-opt-in-for-support-1" name="2-opt-in-for-support" type="radio" value="Yes">
                  <label class="govuk-label govuk-radios__label" for="2-opt-in-for-support">
                    Yes
                  </label>
                </div>
                <div class="govuk-radios__item">
                  <input class="govuk-radios__input" id="2-opt-in-for-support-2" name="2-opt-in-for-support" type="radio" value="No">
                  <label class="govuk-label govuk-radios__label" for="2-opt-in-for-support-2">
                    No
                  </label>
                </div>
              </div>

            </fieldset>
          </div>

          <button class="govuk-button" data-module="govuk-button">
            Continue
          </button>
        </form>

      </div>


    </div>
  </main>
</div>

{% endblock %}
