{% extends "./includes/template.html" %}

{% block content %}
<div class="govuk-width-container">


    <a href="#" class="govuk-back-link">Back</a>

    <main class="govuk-main-wrapper " id="main-content" role="main">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">

        <h1 class="govuk-heading-l">
          Give more details about Kevin Hall's caring responsibilities
        </h1>

        <form action="/v19/checklist/scenario-1/q4b-management-mental-health" method="post" novalidate>

          <div class="govuk-form-group">
            <label class="govuk-label govuk-label--m" for="full-time">
              Are caring responsibilities full time?
            </label>

        <div class="govuk-radios govuk-radios--inline" data-module="govuk-radios">
          <div class="govuk-radios__item">
            <input class="govuk-radios__input" id="full-time" name="full-time" type="radio" value="Yes">
            <label class="govuk-label govuk-radios__label" for="full-time">
              Yes
            </label>
          </div>
          <div class="govuk-radios__item">
            <input class="govuk-radios__input" id="full-time-2" name="full-time" type="radio" value="No">
            <label class="govuk-label govuk-radios__label" for="full-time-2">
              No
            </label>
          </div>
        </div>
      </div>

      <div class="govuk-form-group">
        <label class="govuk-label govuk-label--m" for="allowance">
          Will they be receiving a Carer's Allowance?
        </label>

    <div class="govuk-radios govuk-radios--inline" data-module="govuk-radios">
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="allowance" name="allowance" type="radio" value="Yes">
        <label class="govuk-label govuk-radios__label" for="allowance">
          Yes
        </label>
      </div>
      <div class="govuk-radios__item">
        <input class="govuk-radios__input" id="allowance-2" name="allowance" type="radio" value="No">
        <label class="govuk-label govuk-radios__label" for="allowance-2">
          No
        </label>
      </div>
    </div>
  </div>
</div>


            </fieldset>
          </div>

          <button class="govuk-button" data-module="govuk-button">
            Continue
          </button>

        </form>

      </div>


    </div>
  </main>
</div>

{% endblock %}
