{% extends "./includes/template.html" %}

{% block content %}
<div class="govuk-width-container">


    <a href="/v19/checklist/q2-opt-in-for-support" class="govuk-back-link">Back</a>

    <main class="govuk-main-wrapper " id="main-content" role="main">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">

        <form action="/reason-for-decline-answer" method="post" novalidate>

          <div class="govuk-form-group">
            <fieldset class="govuk-fieldset" aria-describedby="reason-for-decline-got-hint">
              <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
                <h1 class="govuk-fieldset__heading">
                Why doesn't Kevin Hall want support?
                </h1>
              </legend>
              <div id="reason-for-decline-got-hint" class="govuk-hint">
                Select all that apply.
              </div>
              <div class="govuk-checkboxes" data-module="govuk-checkboxes">
                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="reason-for-decline" name="reason-for-decline" type="checkbox" value="caring">
                  <label class="govuk-label govuk-checkboxes__label" for="reason-for-decline">
                    Has full-time caring responsibilities
                  </label>
                </div>
                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="reason-for-decline-1" name="reason-for-decline-got" type="checkbox" value="confidence">
                  <label class="govuk-label govuk-checkboxes__label" for="reason-for-decline-1">
                    Lacks confidence in their ability to get a job
                  </label>
                </div>
                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="reason-for-decline-2" name="reason-for-decline" type="checkbox" value="motivation">
                  <label class="govuk-label govuk-checkboxes__label" for="reason-for-decline-2">
                    Lacks motivation to get a job
                  </label>
                </div>

                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="reason-for-decline-3" name="reason-for-decline" type="checkbox" value="health">
                  <label class="govuk-label govuk-checkboxes__label" for="reason-for-decline-3">
                    Not able to work due to a health condition or illness
                  </label>
                </div>

                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="reason-for-decline-" name="reason-for-decline" type="checkbox" value="retired">
                  <label class="govuk-label govuk-checkboxes__label" for="reason-for-decline-4">
                    Retired
                  </label>
                </div>
                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="reason-for-decline-5" name="reason-for-decline" type="checkbox" value="returning to job">
                  <label class="govuk-label govuk-checkboxes__label" for="reason-for-decline-5">
                    Returning to a job they had before prison
                  </label>
                </div>
                <div class="govuk-checkboxes__item">
                  <input class="govuk-checkboxes__input" id="reason-for-decline-6" name="reason-for-decline" type="checkbox" value="self-employed">
                  <label class="govuk-label govuk-checkboxes__label" for="reason-for-decline-6">
                    Self-employed
                  </label>
                </div>
              </div>

            </fieldset>
          </div>

          <button class="govuk-button" data-module="govuk-button">
            Continue
          </button>
        </form>

      </div>


    </div>
  </main>
</div>

{% endblock %}
