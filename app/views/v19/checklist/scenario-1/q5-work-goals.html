{% extends "./includes/template.html" %}

{% block content %}
<div class="govuk-width-container">


    <a href="#" class="govuk-back-link">Back</a>

    <main class="govuk-main-wrapper " id="main-content" role="main">
    <div class="govuk-grid-row">
      <div class="govuk-grid-column-two-thirds">

        <h1 class="govuk-heading-l">
          Does Kevin Hall have work goals?
        </h1>

        <form action="/v19/checklist/scenario-1/q6-job-sectors" method="post" novalidate>

          <div class="govuk-form-group">
            <fieldset class="govuk-fieldset">
              <div class="govuk-radios govuk-radios--conditional" data-module="govuk-radios">
                <div class="govuk-radios__item">

                  <input class="govuk-radios__input" id="1-work-goals" name="1-work-goals" type="radio" value="1-yes" data-aria-controls="conditional-1-work-goals">
                  <label class="govuk-label govuk-radios__label" for="1-work-goals">
                    Yes
                  </label>
                </div>
                <div class="govuk-radios__conditional govuk-radios__conditional--hidden" id="conditional-1-work-goals">
                  <div class="govuk-character-count" data-module="govuk-character-count" data-maxlength="200">
                  <div class="govuk-form-group">
                    <label class="govuk-label" for="1-work-goals">
                      Enter comments (optional)
                    </label>
                    </h1>
                    <textarea class="govuk-textarea govuk-js-character-count" id="with-hint" name="with-hint" rows="3" aria-describedby="with-hint-info with-hint-hint"></textarea>
                  </div>

                  <div id="with-hint-info" class="govuk-hint govuk-character-count__message" aria-live="polite">
                    You can enter up to 200 characters
                  </div>

                </div>

                </div>
                <div class="govuk-radios__item">
                  <input class="govuk-radios__input" id="1-work-goals-2" name="1-work-goals" type="radio" value="no" data-aria-controls="conditional-1-work-goals-2">
                  <label class="govuk-label govuk-radios__label" for="1-work-goals-2">
                    No
                  </label>
                </div>
                </div>

            </fieldset>
          </div>

          <button class="govuk-button" data-module="govuk-button">
            Continue
          </button>
        </form>

      </div>


    </div>
  </main>
</div>

{% endblock %}
