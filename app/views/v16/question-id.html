{% extends "./includes/template.html" %}

{% block content %}
<div class="govuk-width-container">

  <a href="/v16/start-page" class="govuk-back-link">Back</a>

  <main class="govuk-main-wrapper " id="main-content" role="main">
  <div class="govuk-grid-row">
    <div class="govuk-grid-column-two-thirds">
      <form action="/form-handler" method="post" novalidate>

        <div class="govuk-form-group">
          <fieldset class="govuk-fieldset">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
              <h1 class="govuk-fieldset__heading">
                Does Kevin Hall have ID?
              </h1>
            </legend>

            <p>
              This includes things like a:
              <ul class="govuk-list govuk-list--bullet">
                <li>passport</li>
                <li>driving licence</li>
                <li>birth certificate</li>
              </ul>
            </p>

            <div class="govuk-radios">
              <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="id" name="id" type="radio" value="yes">
                <label class="govuk-label govuk-radios__label" for="id">
                  Yes
                </label>
              </div>
              <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="id-2" name="id" type="radio" value="no">
                <label class="govuk-label govuk-radios__label" for="id-2">
                  No
                </label>
              </div>
              <div class="govuk-radios__item">
                <input class="govuk-radios__input" id="id-3" name="id" type="radio" value="not sure">
                <label class="govuk-label govuk-radios__label" for="id-3">
                  I'm not sure
                </label>
              </div>
            </div>

          </fieldset>
        </div>

        <button class="govuk-button" data-module="govuk-button">
          Save and continue
        </button>
      </form>
    </div>
  </div>
</main>
</div>

{% endblock %}
