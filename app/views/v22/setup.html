{% extends "../layout-scenarios.html" %}

{% block content %}
  <div class="govuk-width-container">

    <form class="form" method="post">

      <div class="govuk-form-group">
        <fieldset class="govuk-fieldset">
          <div class="govuk-radios" data-module="govuk-radios">
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="scenario-1" name="scenario" type="radio" value="1">
              <label class="govuk-label govuk-radios__label" for="scenario-1">
                Scenario 1
              </label>
            </div>
            <div class="govuk-radios__item">
              <input class="govuk-radios__input" id="scenario-2" name="scenario" type="radio" value="2">
              <label class="govuk-label govuk-radios__label" for="scenario-2">
                Scenario 2
              </label>
            </div>
          </div>

        </fieldset>
      </div>

      <button class="govuk-button" data-module="govuk-button">
        Start prototype
      </button>

    </form>


  </div>
{% endblock %}
